<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>VIXEN Price Board</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --navy:#07111f;
  --navy2:#0c1b2d;
  --blue:#1267d6;
  --blue2:#0b4da8;
  --gold:#f4b72b;
  --orange:#f28c28;
  --text:#142033;
  --muted:#697586;
  --line:#dfe5ec;
  --light:#f5f7fa;
  --white:#ffffff;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#eef2f6;
  color:var(--text);
  min-height:100vh;
}

/* ================= HEADER ================= */

.header{
  background:var(--navy);
  color:white;
  min-height:105px;
  position:relative;
  overflow:hidden;
}

.header:after{
  content:"";
  position:absolute;
  width:430px;
  height:430px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:50%;
  right:-150px;
  top:-250px;
}

.header-inner{
  max-width:1280px;
  margin:auto;
  padding:22px 25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:relative;
  z-index:2;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.vx{
  width:52px;
  height:52px;
  background:white;
  color:var(--navy);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:20px;
  letter-spacing:-2px;
  transform:skew(-8deg);
}

.brand-text{
  line-height:1;
}

.brand-text .small{
  font-size:11px;
  letter-spacing:3px;
  opacity:.65;
  margin-bottom:5px;
}

.brand-text .main{
  font-size:25px;
  font-weight:900;
  letter-spacing:1px;
}

.brand-text .sub{
  font-size:10px;
  letter-spacing:4px;
  color:#9fc5ff;
  margin-top:5px;
}

.header-tag{
  font-size:11px;
  letter-spacing:2px;
  border-left:1px solid rgba(255,255,255,.2);
  padding-left:20px;
  color:#b7c5d7;
}

/* ================= MAIN ================= */

.container{
  max-width:1280px;
  margin:auto;
  padding:28px 25px 50px;
}

/* ================= SEARCH BOARD ================= */

.search-board{
  background:white;
  border:1px solid #dce3eb;
  box-shadow:0 10px 30px rgba(12,27,45,.07);
  padding:20px;
  margin-top:-25px;
  position:relative;
  z-index:5;
}

.search-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:13px;
}

.search-title strong{
  font-size:14px;
  letter-spacing:1px;
  text-transform:uppercase;
}

.search-title span{
  font-size:11px;
  color:#8793a2;
}

.search-grid{
  display:grid;
  grid-template-columns:1.1fr 1.6fr .8fr;
  gap:10px;
}

.field{
  position:relative;
}

.field input,
.field select{
  width:100%;
  height:50px;
  border:1px solid #d5dce5;
  background:#fafbfd;
  padding:0 15px;
  outline:none;
  color:#172335;
  font-size:14px;
  border-radius:2px;
}

.field input:focus,
.field select:focus{
  border-color:var(--blue);
  background:white;
  box-shadow:0 0 0 3px rgba(18,103,214,.08);
}

.status{
  margin-top:10px;
  min-height:17px;
  font-size:11px;
  color:#788596;
}

/* ================= PRODUCT BOARD ================= */

#result{
  display:none;
  margin-top:24px;
}

.product-board{
  background:white;
  border:1px solid #d9e0e8;
  box-shadow:0 12px 35px rgba(12,27,45,.08);
}

.product-top{
  display:grid;
  grid-template-columns:1.5fr .8fr;
  min-height:185px;
}

.product-info{
  padding:30px 32px;
  border-right:1px solid var(--line);
  position:relative;
}

.product-info:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:5px;
  background:var(--blue);
}

.category-label{
  display:inline-block;
  font-size:10px;
  letter-spacing:2px;
  color:var(--blue);
  font-weight:bold;
  margin-bottom:15px;
  text-transform:uppercase;
}

.product-name{
  font-size:29px;
  font-weight:900;
  line-height:1.05;
  text-transform:uppercase;
  margin-bottom:8px;
}

.product-code{
  font-size:12px;
  color:#778494;
  letter-spacing:1px;
}

.price-area{
  padding:30px;
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  gap:20px;
}

.price-box{
  border-left:1px solid #e0e5eb;
  padding-left:20px;
}

.price-label{
  font-size:10px;
  color:#7c8795;
  letter-spacing:1.5px;
  text-transform:uppercase;
  margin-bottom:8px;
}

.price{
  font-size:29px;
  font-weight:900;
  color:var(--navy);
}

/* MRP — NO CUT / NO LINE THROUGH */
.mrp .price{
  color:#5d6877;
  font-size:23px;
  text-decoration:none;
}

/* ================= SCHEME ================= */

.scheme-section{
  border-top:1px solid var(--line);
}

.scheme-heading{
  height:52px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  background:#fbfcfd;
  border-bottom:1px solid var(--line);
}

.scheme-heading-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.scheme-mark{
  width:8px;
  height:8px;
  background:var(--gold);
}

.scheme-heading strong{
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
}

.scheme-heading span{
  font-size:10px;
  color:#8793a2;
}

.offer-row{
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.offer{
  min-height:105px;
  padding:18px;
  border-right:1px solid var(--line);
  position:relative;
}

.offer:last-child{
  border-right:none;
}

.offer:hover{
  background:#fffaf0;
}

.offer-qty{
  font-size:11px;
  color:#7d8794;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:10px;
}

.offer-qty b{
  color:var(--navy);
  font-size:15px;
}

.offer-price{
  font-size:23px;
  font-weight:900;
  color:#c87500;
}

.no-offer{
  padding:25px;
  color:#8994a1;
  font-size:13px;
}

/* ================= CATEGORY ================= */

#categoryResults{
  display:none;
  margin-top:24px;
}

.catalogue{
  background:white;
  border:1px solid #d9e0e8;
  box-shadow:0 10px 30px rgba(12,27,45,.06);
}

.catalogue-title{
  padding:22px 25px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.catalogue-title h2{
  font-size:20px;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.catalogue-title span{
  font-size:11px;
  color:#84909e;
}

.table-head,
.catalogue-row{
  display:grid;
  grid-template-columns:2.2fr .7fr .7fr 2fr;
  align-items:center;
}

.table-head{
  min-height:42px;
  background:var(--navy);
  color:white;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1.2px;
  padding:0 20px;
}

.catalogue-row{
  min-height:82px;
  border-bottom:1px solid #e7ebef;
  padding:0 20px;
}

.catalogue-row:hover{
  background:#f8fafc;
}

.catalogue-row:last-child{
  border-bottom:none;
}

.cat-product{
  font-size:14px;
  font-weight:bold;
}

.cat-code{
  display:block;
  margin-top:5px;
  color:#8a95a2;
  font-size:10px;
  font-weight:normal;
}

.cat-price{
  font-size:15px;
  font-weight:900;
}

.cat-mrp{
  font-size:13px;
  color:#687483;
  text-decoration:none;
}

.cat-offers{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.cat-offer{
  border:1px solid #e1e5ea;
  padding:7px 9px;
  background:#fffaf0;
  font-size:10px;
  white-space:nowrap;
}

.cat-offer b{
  color:#b86d00;
  font-size:11px;
}

/* ================= BUTTONS ================= */

.actions{
  display:flex;
  justify-content:flex-end;
  margin-top:18px;
}

.print-btn{
  height:42px;
  padding:0 18px;
  border:0;
  background:var(--navy);
  color:white;
  cursor:pointer;
  font-size:11px;
  letter-spacing:1px;
  text-transform:uppercase;
}

.print-btn:hover{
  background:var(--blue);
}

/* ================= NOT FOUND ================= */

.loading{
  background:white;
  border:1px solid #dce2e9;
  padding:30px;
  text-align:center;
  color:#697586;
  box-shadow:0 8px 25px rgba(0,0,0,.05);
}

/* ================= FOOTER ================= */

.footer{
  text-align:center;
  padding:20px;
  color:#8793a1;
  font-size:10px;
  letter-spacing:1px;
}

/* ================= MOBILE ================= */

@media(max-width:800px){

  .header{
    min-height:88px;
  }

  .header-inner{
    padding:17px 16px;
  }

  .vx{
    width:43px;
    height:43px;
    font-size:17px;
  }

  .brand-text .main{
    font-size:19px;
  }

  .brand-text .sub{
    font-size:8px;
  }

  .header-tag{
    display:none;
  }

  .container{
    padding:20px 12px 35px;
  }

  .search-board{
    margin-top:-15px;
    padding:15px;
  }

  .search-title span{
    display:none;
  }

  .search-grid{
    grid-template-columns:1fr;
    gap:8px;
  }

  .field input,
  .field select{
    height:47px;
  }

  .product-top{
    display:block;
  }

  .product-info{
    padding:24px 22px;
    border-right:none;
    border-bottom:1px solid var(--line);
  }

  .product-name{
    font-size:23px;
  }

  .price-area{
    padding:20px;
    gap:10px;
  }

  .price-box{
    padding-left:12px;
  }

  .price{
    font-size:24px;
  }

  .mrp .price{
    font-size:20px;
  }

  .scheme-heading{
    padding:0 18px;
  }

  .scheme-heading span{
    display:none;
  }

  .offer-row{
    grid-template-columns:repeat(2,1fr);
  }

  .offer{
    border-bottom:1px solid var(--line);
  }

  .offer:nth-child(2n){
    border-right:none;
  }

  .offer-price{
    font-size:21px;
  }

  .table-head{
    display:none;
  }

  .catalogue-row{
    display:block;
    padding:16px;
    min-height:auto;
  }

  .cat-product{
    margin-bottom:13px;
  }

  .cat-price,
  .cat-mrp{
    display:inline-block;
    margin-right:15px;
  }

  .cat-offers{
    margin-top:13px;
  }

  .cat-offer{
    padding:6px 8px;
  }
}

/* ================= PRINT ================= */

@media print{

  body{
    background:white;
  }

  .header{
    background:#07111f !important;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }

  .container{
    padding:20px;
  }

  .search-board,
  .footer,
  .actions{
    display:none !important;
  }

  #result{
    display:block !important;
  }

  .product-board{
    box-shadow:none;
  }

  /* Print mein bhi MRP cut nahi hoga */
  .mrp .price,
  .cat-mrp{
    text-decoration:none !important;
  }
}

</style>
</head>

<body>

<header class="header">

  <div class="header-inner">

    <div class="brand">

      <div class="vx">VX</div>

      <div class="brand-text">

        <div class="small">
          BHALLA SPORTS
        </div>

        <div class="main">
          VIXEN
        </div>

        <div class="sub">
          SPORTS PRICE BOARD
        </div>

      </div>

    </div>

    <div class="header-tag">
      DEALER PRICE • SCHEME • MRP
    </div>

  </div>

</header>


<main class="container">

  <!-- SEARCH -->

  <section class="search-board">

    <div class="search-title">

      <strong>
        Product Search
      </strong>

      <span>
        Search by product code, name or category
      </span>

    </div>


    <div class="search-grid">

      <div class="field">

        <input
          id="codeInput"
          type="text"
          placeholder="PRODUCT CODE"
          autocomplete="off">

      </div>


      <div class="field">

        <input
          id="nameInput"
          type="text"
          placeholder="SEARCH PRODUCT NAME"
          autocomplete="off">

      </div>


      <div class="field">

        <select id="categorySelect" disabled>

          <option>
            Loading categories...
          </option>

        </select>

      </div>

    </div>


    <div id="status" class="status">
      Loading price data...
    </div>

  </section>


  <!-- PRODUCT RESULT -->

  <section id="result"></section>


  <!-- CATEGORY RESULT -->

  <section id="categoryResults"></section>

</main>


<footer class="footer">

  BHALLA SPORTS PVT. LTD.
  • VIXEN
  • PRICE BOARD

</footer>


<script>

const API_URL =
"const API_URL =
"https://script.google.com/macros/s/AKfycbxXFCPney8rGxtPs3KA1uTuz1oUaDbpn5FGkDChqi5-7rbZbPbJBzUnr3lfLhq6L_iR-A/exec";

const STORAGE_KEY =
"SCHEME_VIXEN_DATA_V1";

let sheetData = [];
let searchTimer = null;

const codeInput =
document.getElementById("codeInput");

const nameInput =
document.getElementById("nameInput");

const categorySelect =
document.getElementById("categorySelect");

const statusBox =
document.getElementById("status");


/* ================= RUPEE ================= */

function rupee(val){

  if(
    val === null ||
    val === undefined ||
    val === ""
  )
    return "-";

  return String(val)
    .replace(/₹/g,"")
    .trim();

}


/* ================= OFFERS ================= */

function buildOffers(item){

  const offers = [];

  ["","_1","_2","_3","_4"].forEach(s => {

    const q =
      item["Qty" + s];

    const p =
      item["OFFER RATE" + s];

    if(
      q !== null &&
      q !== undefined &&
      q !== "" &&
      p !== null &&
      p !== undefined &&
      p !== ""
    ){

      offers.push({
        q:q,
        p:p
      });

    }

  });

  return offers;

}


/* ================= LOCAL DATA ================= */

function saveLocalData(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(sheetData)
    );

  }catch(e){

    console.log(
      "Local save skipped"
    );

  }

}


function loadLocalData(){

  try{

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );

    if(!saved)
      return false;

    const data =
      JSON.parse(saved);

    if(
      Array.isArray(data) &&
      data.length
    ){

      sheetData = data;

      fillCategoryDropdown();

      categorySelect.disabled =
        false;

      statusBox.textContent =
        "Data ready • Updating...";

      return true;

    }

  }catch(e){

    console.log(
      "Local data error"
    );

  }

  return false;

}


/* ================= API ================= */

function fetchFreshData(){

  fetch(API_URL,{
    method:"GET",
    cache:"no-store"
  })

  .then(response => {

    if(!response.ok)
      throw new Error(
        "Network error"
      );

    return response.json();

  })

  .then(data => {

    if(!Array.isArray(data))
      throw new Error(
        "Invalid data"
      );

    sheetData = data;

    saveLocalData();

    fillCategoryDropdown();

    categorySelect.disabled =
      false;

    statusBox.textContent =
      "✓ Live data updated";

    if(codeInput.value.trim()){

      autoSearch();

    }
    else if(nameInput.value.trim()){

      searchByName();

    }

  })

  .catch(error => {

    console.log(error);

    if(sheetData.length){

      statusBox.textContent =
        "✓ Saved data • Live update unavailable";

    }else{

      statusBox.textContent =
        "❌ Unable to load data";

      categorySelect.innerHTML =
        "<option>Unable to load</option>";

    }

  });

}


/* ================= CATEGORY ================= */

function fillCategoryDropdown(){

  const categories = [
    ...new Set(
      sheetData
        .map(item =>
          item["CATEGORY"]
        )
        .filter(Boolean)
    )
  ].sort();


  categorySelect.innerHTML =
    '<option value="">ALL CATEGORIES</option>';


  categories.forEach(category => {

    const option =
      document.createElement(
        "option"
      );

    option.value =
      category;

    option.textContent =
      category;

    categorySelect.appendChild(
      option
    );

  });

}


/* ================= SEARCH CODE ================= */

function autoSearch(){

  const code =
    codeInput.value.trim();

  if(!code){

    clearAll();

    return;

  }


  const item =
    sheetData.find(row =>
      String(row["CODE"])
        .trim() === code
    );


  if(!item){

    showNotFound();

    return;

  }


  renderItem(item);

}


/* ================= SEARCH NAME ================= */

function searchByName(){

  const name =
    nameInput.value
      .trim()
      .toLowerCase();

  if(!name)
    return;


  const item =
    sheetData.find(row =>
      String(
        row["ITEM NAME"] || ""
      )
      .toLowerCase()
      .includes(name)
    );


  if(!item){

    showNotFound();

    return;

  }


  codeInput.value =
    item["CODE"];


  renderItem(item);

}


/* ================= RENDER PRODUCT ================= */

function renderItem(item){

  const result =
    document.getElementById(
      "result"
    );

  const categoryResults =
    document.getElementById(
      "categoryResults"
    );


  categoryResults.style.display =
    "none";

  result.style.display =
    "block";


  const offers =
    buildOffers(item);


  let offerHTML = "";


  if(offers.length){

    offerHTML =
      offers.map(offer => {

        return `

          <div class="offer">

            <div class="offer-qty">

              QTY

              <b>
                ${offer.q}
              </b>

            </div>

            <div class="offer-price">

              ₹${rupee(offer.p)}

            </div>

          </div>

        `;

      }).join("");

  }else{

    offerHTML = `

      <div class="no-offer">

        No special scheme available
        for this product.

      </div>

    `;

  }


  result.innerHTML = `

    <div class="product-board">

      <div class="product-top">

        <div class="product-info">

          <div class="category-label">

            ${item["CATEGORY"] ||
              "SPORTS PRODUCT"}

          </div>


          <div class="product-name">

            ${item["ITEM NAME"] || "-"}

          </div>


          <div class="product-code">

            PRODUCT CODE :
            ${item["CODE"] || "-"}

          </div>

        </div>


        <div class="price-area">

          <div class="price-box">

            <div class="price-label">

              Dealer Price

            </div>

            <div class="price">

              ₹${rupee(item["DP"])}

            </div>

          </div>


          <div class="price-box mrp">

            <div class="price-label">

              MRP

            </div>

            <div class="price">

              ₹${rupee(item["MRP"])}

            </div>

          </div>

        </div>

      </div>


      <div class="scheme-section">

        <div class="scheme-heading">

          <div class="scheme-heading-left">

            <div class="scheme-mark"></div>

            <strong>
              Special Scheme
            </strong>

          </div>


          <span>
            QUANTITY BASED OFFER
          </span>

        </div>


        <div class="offer-row">

          ${offerHTML}

        </div>

      </div>

    </div>


    <div class="actions">

      <button
        class="print-btn"
        onclick="window.print()">

        PRINT PRICE

      </button>

    </div>

  `;

}


/* ================= CATEGORY SEARCH ================= */

function searchByCategory(){

  const category =
    categorySelect.value;

  const box =
    document.getElementById(
      "categoryResults"
    );


  document.getElementById(
    "result"
  ).style.display = "none";


  if(!category){

    box.style.display =
      "none";

    return;

  }


  const items =
    sheetData.filter(item =>
      item["CATEGORY"] === category
    );


  box.style.display =
    "block";


  let rows = "";


  items.forEach(item => {

    const offers =
      buildOffers(item);


    let offersHTML = "";


    if(offers.length){

      offersHTML =
        offers.map(offer => {

          return `

            <div class="cat-offer">

              ${offer.q}
              →

              <b>
                ₹${rupee(offer.p)}
              </b>

            </div>

          `;

        }).join("");

    }else{

      offersHTML = `

        <span style="
          font-size:11px;
          color:#929ca8;
        ">

          No scheme

        </span>

      `;

    }


    rows += `

      <div class="catalogue-row">

        <div class="cat-product">

          ${item["ITEM NAME"] || "-"}

          <span class="cat-code">

            CODE :
            ${item["CODE"] || "-"}

          </span>

        </div>


        <div class="cat-price">

          ₹${rupee(item["DP"])}

        </div>


        <div class="cat-mrp">

          ₹${rupee(item["MRP"])}

        </div>


        <div class="cat-offers">

          ${offersHTML}

        </div>

      </div>

    `;

  });


  box.innerHTML = `

    <div class="catalogue">

      <div class="catalogue-title">

        <h2>
          ${category}
        </h2>

        <span>
          ${items.length} PRODUCTS
        </span>

      </div>


      <div class="table-head">

        <div>
          PRODUCT
        </div>

        <div>
          DP
        </div>

        <div>
          MRP
        </div>

        <div>
          SCHEME
        </div>

      </div>


      ${rows}

    </div>

  `;

}


/* ================= CLEAR ================= */

function clearAll(){

  document.getElementById(
    "result"
  ).style.display = "none";


  document.getElementById(
    "categoryResults"
  ).style.display = "none";

}


/* ================= NOT FOUND ================= */

function showNotFound(){

  const result =
    document.getElementById(
      "result"
    );


  result.style.display =
    "block";


  document.getElementById(
    "categoryResults"
  ).style.display =
    "none";


  result.innerHTML = `

    <div class="loading">

      ❌ Item not found

      <div style="
        font-size:11px;
        margin-top:8px;
        color:#929daa;
      ">

        Please check product code
        or name.

      </div>

    </div>

  `;

}


/* ================= INPUT EVENTS ================= */

codeInput.addEventListener(
  "input",
  () => {

    clearTimeout(searchTimer);

    searchTimer =
      setTimeout(
        autoSearch,
        100
      );

  }
);


nameInput.addEventListener(
  "input",
  () => {

    clearTimeout(searchTimer);

    searchTimer =
      setTimeout(
        searchByName,
        120
      );

  }
);


categorySelect.addEventListener(
  "change",
  searchByCategory
);


/* ================= START ================= */

loadLocalData();

fetchFreshData();

</script>

</body>
</html>
