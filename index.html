<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1f3a">
<title>BHALLA SPORTS VX VIXEN</title>

<style>
:root{
  --navy:#0b1f3a;
  --blue:#1769e0;
  --blue2:#0f56c7;
  --light:#f5f7fa;
  --border:#e3e7ed;
  --text:#17202d;
  --muted:#7b8491;
  --green:#16834d;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--light);
  color:var(--text);
  min-height:100vh;
}

/* ================= HEADER ================= */

.header{
  background:var(--navy);
  color:white;
}

.header-inner{
  max-width:1050px;
  margin:auto;
  min-height:76px;
  padding:0 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo-area{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:44px;
  height:44px;
  border:2px solid rgba(255,255,255,.85);
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  font-weight:900;
  letter-spacing:-1px;
}

.company{
  font-size:17px;
  font-weight:800;
  letter-spacing:.5px;
}

.brand{
  font-size:11px;
  color:#8dbbff;
  font-weight:800;
  letter-spacing:2px;
  margin-top:3px;
}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:11px;
  color:#cbd7e8;
}

.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#39c77b;
}

/* ================= MAIN ================= */

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:34px 18px 45px;
}

/* ================= TITLE ================= */

.page-title{
  margin-bottom:22px;
}

.page-title .small{
  color:var(--blue);
  font-size:11px;
  font-weight:800;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

.page-title h1{
  font-size:28px;
  line-height:34px;
  margin-top:5px;
  letter-spacing:-.7px;
}

.page-title p{
  color:var(--muted);
  font-size:13px;
  margin-top:6px;
}

/* ================= SEARCH PANEL ================= */

.search-panel{
  background:white;
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
  box-shadow:0 5px 18px rgba(12,32,60,.05);
}

.search-box{
  position:relative;
}

.search-box svg{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  width:19px;
  height:19px;
  stroke:#8b95a3;
}

.search-input{
  width:100%;
  height:54px;
  border:1px solid #d6dce5;
  border-radius:10px;
  padding:0 45px;
  outline:none;
  font-size:15px;
  color:var(--text);
  background:#fff;
}

.search-input::placeholder{
  color:#9ba3ae;
}

.search-input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(23,105,224,.09);
}

.filter-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

.field{
  height:44px;
  width:100%;
  border:1px solid #dce1e8;
  border-radius:9px;
  padding:0 12px;
  outline:none;
  background:#fff;
  color:#303947;
  font-size:13px;
}

.field:focus{
  border-color:var(--blue);
}

.buttons{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.btn{
  height:39px;
  padding:0 16px;
  border:0;
  border-radius:8px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
}

.clear-btn{
  background:#eef1f5;
  color:#4d5663;
}

.print-btn{
  background:var(--blue);
  color:#fff;
}

/* ================= RESULT ================= */

#result{
  margin-top:20px;
}

/* ================= PRODUCT ================= */

.product{
  background:white;
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 5px 18px rgba(12,32,60,.05);
}

.product-header{
  padding:20px;
  border-bottom:1px solid #edf0f3;
}

.product-label{
  display:inline-block;
  color:var(--blue);
  font-size:10px;
  font-weight:800;
  letter-spacing:1px;
  text-transform:uppercase;
  margin-bottom:8px;
}

.product-name{
  font-size:21px;
  line-height:27px;
  font-weight:800;
  color:#111a27;
}

.product-info{
  display:flex;
  gap:18px;
  margin-top:7px;
  color:#808a97;
  font-size:12px;
}

.product-info b{
  color:#3c4654;
}

/* ================= PRICE ================= */

.price-section{
  display:grid;
  grid-template-columns:1fr 1fr;
  border-bottom:1px solid #edf0f3;
}

.price-item{
  padding:18px 20px;
}

.price-item:first-child{
  border-right:1px solid #edf0f3;
}

.price-label{
  color:#858e9a;
  font-size:10px;
  text-transform:uppercase;
  font-weight:800;
  letter-spacing:.9px;
}

.price-value{
  margin-top:4px;
  font-size:24px;
  font-weight:800;
}

.dp{
  color:var(--blue);
}

.mrp{
  color:#202b3b;
}

/* ================= SCHEME ================= */

.scheme{
  padding:20px;
}

.scheme-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.scheme-title h2{
  font-size:15px;
  font-weight:800;
}

.scheme-title span{
  font-size:10px;
  color:#87909d;
  font-weight:700;
  letter-spacing:.8px;
}

.scheme-table{
  width:100%;
  border-collapse:collapse;
  border:1px solid var(--border);
  border-radius:9px;
  overflow:hidden;
}

.scheme-table th{
  background:#f6f8fa;
  color:#7e8793;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.7px;
  text-align:left;
  padding:10px 13px;
}

.scheme-table td{
  padding:12px 13px;
  border-top:1px solid #edf0f3;
  font-size:13px;
}

.scheme-table td:last-child{
  color:var(--blue);
  font-weight:800;
}

/* ================= CATEGORY ================= */

.category-box{
  background:white;
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 5px 18px rgba(12,32,60,.05);
}

.category-head{
  padding:17px 19px;
  border-bottom:1px solid #edf0f3;
}

.category-head span{
  display:block;
  color:#8a93a0;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:700;
}

.category-head h2{
  margin-top:4px;
  font-size:18px;
}

.item{
  min-height:65px;
  padding:13px 19px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  border-bottom:1px solid #edf0f3;
  cursor:pointer;
}

.item:last-child{
  border-bottom:0;
}

.item:hover{
  background:#f8faff;
}

.item-name{
  font-size:13px;
  font-weight:700;
}

.item-code{
  color:#89929f;
  font-size:10px;
  margin-top:4px;
}

.item-rate{
  text-align:right;
  color:var(--blue);
  font-size:14px;
  font-weight:800;
  white-space:nowrap;
}

/* ================= EMPTY / ERROR ================= */

.message{
  background:white;
  border:1px solid var(--border);
  border-radius:14px;
  padding:38px 20px;
  text-align:center;
  box-shadow:0 5px 18px rgba(12,32,60,.04);
}

.message-icon{
  font-size:25px;
  margin-bottom:9px;
  color:#7d8794;
}

.message h3{
  font-size:16px;
}

.message p{
  color:#8a93a0;
  font-size:12px;
  margin-top:6px;
}

/* ================= FOOTER ================= */

.footer{
  text-align:center;
  color:#9aa2ad;
  font-size:10px;
  margin-top:25px;
  letter-spacing:.4px;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  .header-inner{
    min-height:68px;
    padding:0 14px;
  }

  .logo{
    width:38px;
    height:38px;
    font-size:18px;
  }

  .company{
    font-size:14px;
  }

  .brand{
    font-size:9px;
    letter-spacing:1.5px;
  }

  .status{
    font-size:9px;
  }

  .container{
    padding:25px 12px 35px;
  }

  .page-title{
    margin-bottom:18px;
  }

  .page-title h1{
    font-size:24px;
    line-height:29px;
  }

  .page-title p{
    font-size:12px;
  }

  .search-panel{
    padding:12px;
    border-radius:12px;
  }

  .search-input{
    height:51px;
    font-size:14px;
  }

  .filter-row{
    grid-template-columns:1fr;
  }

  .product-header{
    padding:17px;
  }

  .product-name{
    font-size:19px;
    line-height:25px;
  }

  .product-info{
    gap:12px;
    flex-wrap:wrap;
  }

  .price-item{
    padding:16px 17px;
  }

  .price-value{
    font-size:21px;
  }

  .scheme{
    padding:17px;
  }

  .scheme-table th,
  .scheme-table td{
    padding:10px;
  }

  .item{
    padding:13px 15px;
  }
}

/* ================= PRINT ================= */

@media print{

  body{
    background:#fff;
  }

  .header,
  .page-title,
  .search-panel,
  .footer{
    display:none !important;
  }

  .container{
    padding:0;
    max-width:none;
  }

  #result{
    margin:0;
  }

  .product,
  .category-box{
    box-shadow:none;
    border:1px solid #aaa;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">

    <div class="logo-area">

      <div class="logo">V</div>

      <div>
        <div class="company">BHALLA SPORTS</div>
        <div class="brand">VX VIXEN</div>
      </div>

    </div>

    <div class="status">
      <span class="status-dot"></span>
      LIVE
    </div>

  </div>
</header>


<main class="container">

  <section class="page-title">
    <div class="small">VX VIXEN</div>
    <h1>Scheme & Price</h1>
    <p>Search your product to check current pricing and scheme.</p>
  </section>


  <section class="search-panel">

    <div class="search-box">

      <svg viewBox="0 0 24 24" fill="none">
        <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/>
        <path d="M16 16L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>

      <input
        id="codeInput"
        class="search-input"
        type="text"
        placeholder="Search Item Code / Product Name"
        autocomplete="off"
      >

    </div>


    <div class="filter-row">

      <input
        id="nameInput"
        class="field"
        type="text"
        placeholder="Product Name"
        autocomplete="off"
      >

      <select id="categoryInput" class="field">
        <option value="">All Categories</option>
      </select>

    </div>


    <div class="buttons">

      <button
        class="btn clear-btn"
        onclick="clearAll()"
      >
        Clear
      </button>

      <button
        class="btn print-btn"
        onclick="window.print()"
      >
        Print
      </button>

    </div>

  </section>


  <div id="result">

    <div class="message">
      <div class="message-icon">⌕</div>
      <h3>Search an item</h3>
      <p>Enter item code or product name to view details.</p>
    </div>

  </div>


  <div class="footer">
    BHALLA SPORTS • VX VIXEN
  </div>

</main>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT API
   DO NOT CHANGE
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbxXFCPney8rGxtPs3KA1uTuz1oUaDbpn5FGkDChqi5-7rbZbPbJBzUnr3lfLhq6L_iR-A/exec";

const STORAGE_KEY =
"SCHEME_VIXEN_DATA_V1";

let sheetData = [];
let searchTimer = null;


/* =====================================================
   RUPEE
===================================================== */

function rupee(value){

  if(
    value === "" ||
    value === null ||
    value === undefined
  ){
    return "-";
  }

  const n = Number(value);

  if(isNaN(n)){
    return value;
  }

  return "₹" + n.toLocaleString("en-IN",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
}


/* =====================================================
   BUILD OFFERS
===================================================== */

function buildOffers(item){

  const offers = [];

  const pairs = [
    [item[5],item[6]],
    [item[7],item[8]],
    [item[9],item[10]],
    [item[11],item[12]],
    [item[13],item[14]]
  ];

  pairs.forEach(function(pair){

    const qty = pair[0];
    const rate = pair[1];

    if(
      qty !== "" &&
      qty !== null &&
      qty !== undefined &&
      rate !== "" &&
      rate !== null &&
      rate !== undefined
    ){

      offers.push({
        qty:qty,
        rate:rate
      });

    }

  });

  return offers;
}


/* =====================================================
   LOCAL STORAGE
===================================================== */

function saveLocalData(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(sheetData)
    );

  }catch(e){

    console.log("Local storage error",e);

  }

}


function loadLocalData(){

  try{

    const saved =
      localStorage.getItem(STORAGE_KEY);

    if(saved){

      sheetData = JSON.parse(saved);

      populateCategories();

      autoSearch();

    }

  }catch(e){

    console.log("Local load error",e);

  }

}


/* =====================================================
   FETCH FRESH DATA
===================================================== */

async function fetchFreshData(){

  try{

    const response =
      await fetch(
        API_URL + "?t=" + Date.now()
      );

    const data =
      await response.json();

    if(Array.isArray(data)){

      sheetData = data;

      saveLocalData();

      populateCategories();

      autoSearch();

    }

  }catch(error){

    console.log("API error:",error);

    if(!sheetData.length){

      document.getElementById("result").innerHTML = `

        <div class="message">

          <div class="message-icon">⚠</div>

          <h3>Unable to load data</h3>

          <p>
            Please check your internet connection and try again.
          </p>

        </div>

      `;

    }

  }

}


/* =====================================================
   CATEGORY DROPDOWN
===================================================== */

function populateCategories(){

  const select =
    document.getElementById("categoryInput");

  const current =
    select.value;

  const categories = [
    ...new Set(
      sheetData
        .map(function(row){
          return row[1];
        })
        .filter(Boolean)
        .map(function(x){
          return String(x).trim();
        })
    )
  ].sort();

  select.innerHTML =
    `<option value="">All Categories</option>`;

  categories.forEach(function(category){

    const option =
      document.createElement("option");

    option.value = category;
    option.textContent = category;

    select.appendChild(option);

  });

  if(categories.includes(current)){
    select.value = current;
  }

}


/* =====================================================
   RENDER ITEM
===================================================== */

function renderItem(item){

  const offers =
    buildOffers(item);

  let offerHTML = "";

  if(offers.length){

    offerHTML = `

      <section class="scheme">

        <div class="scheme-title">

          <h2>Special Offer</h2>

          <span>SCHEME RATE</span>

        </div>


        <table class="scheme-table">

          <thead>

            <tr>
              <th>Quantity</th>
              <th>Offer Rate</th>
            </tr>

          </thead>

          <tbody>

            ${
              offers.map(function(o){

                return `

                  <tr>
                    <td>${o.qty}</td>
                    <td>${rupee(o.rate)}</td>
                  </tr>

                `;

              }).join("")
            }

          </tbody>

        </table>

      </section>

    `;

  }else{

    offerHTML = `

      <section class="scheme">

        <div class="scheme-title">
          <h2>Special Offer</h2>
        </div>

        <p style="
          color:#8a93a0;
          font-size:12px;
        ">
          No special offer available.
        </p>

      </section>

    `;

  }


  document.getElementById("result").innerHTML = `

    <article class="product">

      <div class="product-header">

        <div class="product-label">
          ${item[1] || "PRODUCT"}
        </div>

        <div class="product-name">
          ${item[2] || "-"}
        </div>

        <div class="product-info">

          <span>
            Code:
            <b>${item[0] || "-"}</b>
          </span>

          <span>
            Category:
            <b>${item[1] || "-"}</b>
          </span>

        </div>

      </div>


      <div class="price-section">

        <div class="price-item">

          <div class="price-label">
            Dealer Price
          </div>

          <div class="price-value dp">
            ${rupee(item[3])}
          </div>

        </div>


        <div class="price-item">

          <div class="price-label">
            MRP
          </div>

          <div class="price-value mrp">
            ${rupee(item[4])}
          </div>

        </div>

      </div>


      ${offerHTML}

    </article>

  `;

}


/* =====================================================
   SEARCH CODE
===================================================== */

function searchByCode(){

  const value =
    document
      .getElementById("codeInput")
      .value
      .trim()
      .toLowerCase();

  if(!value){

    autoSearch();
    return;

  }

  const item =
    sheetData.find(function(row){

      return String(row[0] || "")
        .toLowerCase() === value;

    });


  if(item){

    renderItem(item);

  }else{

    showNotFound();

  }

}


/* =====================================================
   SEARCH NAME
===================================================== */

function searchByName(){

  const value =
    document
      .getElementById("nameInput")
      .value
      .trim()
      .toLowerCase();

  if(!value){

    autoSearch();
    return;

  }

  const item =
    sheetData.find(function(row){

      return String(row[2] || "")
        .toLowerCase()
        .includes(value);

    });


  if(item){

    renderItem(item);

  }else{

    showNotFound();

  }

}


/* =====================================================
   SEARCH CATEGORY
===================================================== */

function searchByCategory(){

  const category =
    document
      .getElementById("categoryInput")
      .value
      .trim()
      .toLowerCase();

  if(!category){

    autoSearch();
    return;

  }


  const items =
    sheetData.filter(function(row){

      return String(row[1] || "")
        .toLowerCase() === category;

    });


  if(!items.length){

    showNotFound();
    return;

  }


  document.getElementById("result").innerHTML = `

    <section class="category-box">

      <div class="category-head">

        <span>Category</span>

        <h2>
          ${category.toUpperCase()}
        </h2>

      </div>


      ${
        items.map(function(item){

          return `

            <div
              class="item"
              onclick="selectItem('${String(item[0]).replace(/'/g,"\\'")}')"
            >

              <div>

                <div class="item-name">
                  ${item[2] || "-"}
                </div>

                <div class="item-code">
                  CODE: ${item[0] || "-"}
                </div>

              </div>


              <div class="item-rate">
                ${rupee(item[3])}
              </div>

            </div>

          `;

        }).join("")
      }

    </section>

  `;

}


/* =====================================================
   SELECT ITEM
===================================================== */

function selectItem(code){

  const item =
    sheetData.find(function(row){

      return String(row[0]) === String(code);

    });


  if(item){

    renderItem(item);

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

}


/* =====================================================
   AUTO SEARCH
===================================================== */

function autoSearch(){

  clearTimeout(searchTimer);

  searchTimer = setTimeout(function(){

    const code =
      document
        .getElementById("codeInput")
        .value
        .trim();

    const name =
      document
        .getElementById("nameInput")
        .value
        .trim();

    const category =
      document
        .getElementById("categoryInput")
        .value
        .trim();


    if(code){

      searchByCode();
      return;

    }

    if(name){

      searchByName();
      return;

    }

    if(category){

      searchByCategory();
      return;

    }


    if(sheetData.length){

      document.getElementById("result").innerHTML = `

        <div class="message">

          <div class="message-icon">⌕</div>

          <h3>Search an item</h3>

          <p>
            Enter item code or product name to view details.
          </p>

        </div>

      `;

    }

  },180);

}


/* =====================================================
   CLEAR
===================================================== */

function clearAll(){

  document.getElementById("codeInput").value = "";
  document.getElementById("nameInput").value = "";
  document.getElementById("categoryInput").value = "";

  autoSearch();

}


/* =====================================================
   NOT FOUND
===================================================== */

function showNotFound(){

  document.getElementById("result").innerHTML = `

    <div class="message">

      <div class="message-icon">⌕</div>

      <h3>Item not found</h3>

      <p>
        Please check the item code or product name.
      </p>

    </div>

  `;

}


/* =====================================================
   EVENTS
===================================================== */

document
  .getElementById("codeInput")
  .addEventListener("input",autoSearch);

document
  .getElementById("nameInput")
  .addEventListener("input",autoSearch);
